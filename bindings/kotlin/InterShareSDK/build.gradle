plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'idea'
    id "org.mozilla.rust-android-gradle.rust-android"
    id "maven-publish"
}

android {
    namespace 'com.julian_baumann.intershare_sdk'
    compileSdk 36
    ndkVersion '27.3.13750724'

    defaultConfig {
        minSdk 31

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    libraryVariants.all { variant ->
        def t = tasks.register("generate${variant.name.capitalize()}UniFFIBindings", Exec) {
            workingDir "${project.projectDir}"
            // Runs the bindings generation, note that you must have uniffi-bindgen installed and in your PATH environment variable
            commandLine "${System.properties['user.home']}/.cargo/bin/cargo", 'run', '--bin', 'uniffi-bindgen', 'generate', '--library', '../../../target/aarch64-linux-android/release/libintershare_sdk.so', '--config', '../../../src/intershare_sdk/uniffi.toml', '--language', 'kotlin', '--out-dir', "${buildDir}/generated/source/uniffi/${variant.name}/java"
        }

        variant.javaCompileProvider.get().dependsOn(t)
        def sourceSet = variant.sourceSets.find { it.name == variant.name }
        sourceSet.java.srcDir new File(buildDir, "generated/source/uniffi/${variant.name}/java")
        // XXX: I've been trying to make this work but I can't, so the compiled bindings will show as "regular sources" in Android Studio.
        idea.module.generatedSourceDirs += file("${buildDir}/generated/source/uniffi/${variant.name}/java/uniffi")
    }

    publishing {
        singleVariant("release") {
            // if you don't want sources/javadoc, remove these lines
            withSourcesJar()
            withJavadocJar()
        }
    }
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/InterShare/InterShareSDK")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
    publications {
        release(MavenPublication) {
            version = System.getenv("VERSION")
            groupId =  "com.julian_baumann"
            artifactId = "intershare_sdk"

            afterEvaluate {
                from components.release
            }
        }
    }
}

cargo {
    module  = "../../../"
    libname = "intershare_sdk"
    targets = ["arm", "x86_64", "arm64"]
    apiLevel = 31
    profile = "release"
    pythonCommand = "python3"
    cargoCommand = "${System.properties['user.home']}/.cargo/bin/cargo"
    rustcCommand = "${System.properties['user.home']}/.cargo/bin/rustc"
}

tasks.matching { it.name.matches(/merge.*JniLibFolders/) }.configureEach {
    it.inputs.dir(new File(buildDir, "rustJniLibs/android"))
    it.dependsOn("cargoBuild")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation "net.java.dev.jna:jna:5.18.0@aar"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "androidx.security:security-crypto:1.1.0"
}
